set_activity_setpoint:
  name: Set activity setpoint (no hold)
  description: >-
    Edit the CURRENT activity's comfort set point in place WITHOUT creating a manual hold.
    Unlike the built-in temperature set (which forces a hold and suspends the schedule), this
    edits whatever activity the zone is currently following, so a human can still place an
    independent hold that takes precedence, and an HA outage leaves the thermostat on its own
    schedule at the last value written.
  target:
    entity:
      integration: ha_carrier
      domain: climate
  fields:
    temperature:
      name: Temperature
      description: Single set point, for heat or cool mode.
      example: 74
      selector:
        number:
          min: 7
          max: 95
          step: 0.5
    target_temp_low:
      name: Heat set point
      description: Heat set point, for heat_cool (auto) mode.
      example: 68
      selector:
        number:
          min: 7
          max: 95
          step: 0.5
    target_temp_high:
      name: Cool set point
      description: Cool set point, for heat_cool (auto) mode.
      example: 74
      selector:
        number:
          min: 7
          max: 95
          step: 0.5
    activity:
      name: Activity
      description: >-
        Activity whose set points to edit. Omit to edit the activity the zone is following now.
      example: sleep
      selector:
        select:
          options:
            - home
            - away
            - sleep
            - wake
            - manual

get_schedule:
  name: Get schedule
  description: >-
    Return the zone's program (each day's periods, keyed by Carrier day id, with the day's etag)
    and each activity's set points and fan mode, from the latest refresh.
  target:
    entity:
      integration: ha_carrier
      domain: climate

set_program_day:
  name: Set program day
  description: >-
    Replace one day of the zone's program. The Carrier replaces the whole day, so send every
    period of the day, enabled or not, as get_schedule returns them. The zone keeps running its
    own schedule; no hold is created.
  target:
    entity:
      integration: ha_carrier
      domain: climate
  fields:
    day_id:
      name: Day
      description: Carrier day id as get_schedule returns it ("0" to "6").
      required: true
      example: "3"
      selector:
        text:
    periods:
      name: Periods
      description: >-
        The day's periods, each with id and activity (home, away, sleep or wake) and optionally
        time (HH:MM) and enabled (on or off).
      required: true
      example: '[{"id": "1", "activity": "wake", "time": "06:00", "enabled": "on"}]'
      selector:
        object:
    etag:
      name: Etag
      description: Etag to send. Omit to send the day's etag from the latest refresh.
      selector:
        text:
