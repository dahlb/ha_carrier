# Home Assistant Integration Quality Scale self-assessment.
# Rules: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules
# hassfest only validates this file for core integrations; tests/test_quality_scale.py
# checks its format here.
rules:
  # Bronze
  action-setup:
    status: done
    comment: >-
      services.py registers the climate entity services from async_setup with
      service.async_register_platform_entity_service.
  appropriate-polling:
    status: done
    comment: >-
      Websocket push for live updates; polls every 30 minutes for energy and does a full
      refresh at the configurable full refresh interval.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: Config entries are keyed by the Carrier account identity ID.

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      Failed refreshes raise UpdateFailed and only debug-log, so DataUpdateCoordinator logs
      the outage once and its recovery once; websocket data errors log once per streak.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: >-
      Coverage (statements and branches) is above 95% for every module, and
      [tool.coverage.report] fail_under = 95 keeps it there.

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Cloud account integration; there is nothing on the local network to discover.
  discovery-update-info:
    status: exempt
    comment: Cloud account integration; there is nothing on the local network to discover.
  docs-data-update: done
  docs-examples:
    status: todo
    comment: README has no automation examples.
  docs-known-limitations:
    status: todo
    comment: >-
      README mentions the A-model live update limitation under Options; it needs a
      dedicated known limitations section.
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases:
    status: todo
    comment: README has no use case section.
  dynamic-devices:
    status: todo
    comment: >-
      Systems added to the account after setup are tracked by the coordinator but get no
      entities until the integration is reloaded.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: todo
    comment: >-
      All entities are enabled by default; the diagnostic last updated timestamps are
      candidates to disable.
  entity-translations:
    status: done
    comment: >-
      Zone thermostats are named after the user's zone, so they have no translation key.
  exception-translations: done
  icon-translations:
    status: todo
    comment: Icons are set with _attr_icon in code; move them to icons.json.
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: >-
      No user-fixable issues beyond credentials, which the reauthentication flow handles.
  stale-devices:
    status: todo
    comment: >-
      Systems removed from the account are dropped by the coordinator but their devices
      stay; implement async_remove_config_entry_device or remove them automatically.

  # Platinum
  async-dependency: done
  inject-websession:
    status: todo
    comment: >-
      carrier_api accepts a client_session, but the integration does not pass Home
      Assistant's shared aiohttp session.
  strict-typing:
    status: todo
    comment: mypy is not run in strict mode and still reports errors.
